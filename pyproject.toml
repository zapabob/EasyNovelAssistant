[project]
name = "easy-novel-assistant"
version = "0.1.0"
description = "Local Japanese novel generation assistant with speech and image generation integrations."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests==2.34.2",
    "tkinterdnd2==0.3.0",
    "scipy==1.13.0",
    "watchdog==4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.uv]
package = false
